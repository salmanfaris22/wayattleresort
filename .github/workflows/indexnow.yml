# After Vercel finishes a production deploy of main, tell IndexNow (Bing, Yandex, Seznam, Naver…)
# about every page in the sitemap. Google ignores IndexNow; it reads the sitemap on its own.
name: IndexNow after deploy

on:
  status:

jobs:
  indexnow:
    if: github.event.context == 'Vercel' && github.event.state == 'success' && contains(github.event.branches.*.name, 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/indexnow.mjs --all
